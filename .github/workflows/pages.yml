name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html teste-dupla.html manifest.webmanifest sw.js icons fonts vendor _site/
          # versão em teste da dupla em dois celulares (ramo dupla-wifi) em /dupla/; o jogo publicado (main) fica na raiz.
          # Só o main publica (regra do ambiente github-pages).
          # .github/dupla-teste.txt guarda o commit do ramo publicado; mudar esse arquivo no main republica a cópia de teste
          ref=dupla-wifi; [ -f .github/dupla-teste.txt ] && ref=$(grep -v '^#' .github/dupla-teste.txt | head -1)
          if git fetch --depth 1 origin "$ref"; then
            mkdir _dupla _site/dupla && git archive FETCH_HEAD | tar -x -C _dupla
            cp -r _dupla/index.html _dupla/mp-net.js _dupla/icons _dupla/fonts _dupla/vendor _site/dupla/
            sha=$(git rev-parse --short FETCH_HEAD)
            # sem service worker nem manifesto próprios; mp-net.js com versão no endereço (o service worker da raiz guarda cópia)
            sed -i -e "s#src=\"mp-net.js\"#src=\"mp-net.js?v=$sha\"#" -e "s#navigator.serviceWorker.register('sw.js')#Promise.resolve()#" -e "s#const APP_VERSION = '\([0-9]*\)'#const APP_VERSION = '\1 teste $sha'#" _site/dupla/index.html
            sed -i -e "s#'vendor/peerjs.min.js'#'vendor/peerjs.min.js?v=$sha'#g" _site/dupla/mp-net.js
          fi
          echo "::notice::site montado com $(find _site -type f | wc -l) arquivos"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
