<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#160d38">
<meta name="description" content="Jogo de ritmo: unicórnios de pantufa patinam no gelo em Buenos Aires e numa discoteca neon dos anos 70. Para 1 ou 2 jogadores.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/titan-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>Galope no Gelo</title>
<style>
@font-face{font-family:"Titan One";src:url(fonts/titan-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"M PLUS Rounded 1c";src:url(fonts/m-plus-rounded-1c-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"M PLUS Rounded 1c";src:url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Silkscreen";src:url(fonts/silkscreen-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
:root{
  /* Uma tela em retrato. Cena 3D de baixa resolução ao fundo; em dupla, a tela se divide ao meio
     e a metade de cima gira 180° para quem está do outro lado da mesa. */
  --deep:#0b0720;
  --night:#160d38;
  --panel:rgba(14,8,40,.86);
  --ink:#fbf4ff;
  --muted:#c3b4ee;
  --pink:#ff4fa8;
  --pink-dk:#a8226c;
  --violet:#8a5cff;
  --blue:#4f86ff;
  --blue-dk:#2443a8;
  --ice:#c6f1ff;
  --gold:#ffd660;
  --mint:#7dffc8;
  --teal:#5fe3e0;
  --outline:#2a0b4d;
  --f-display:"Titan One","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c",ui-rounded,system-ui,sans-serif;
  --f-pixel:"Silkscreen",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--deep)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;height:100%;width:100%;max-width:calc(100dvh * .58);margin:0 auto;overflow:hidden;background:var(--night);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;container-type:size}
[hidden]{display:none!important}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}

/* Visão de cada jogador */
.pv{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;container-type:size;--padH:16.5%}
#app.two .pv{height:50%;--padH:21%}
#app.two .pv.p0{top:50%}
#app.two .pv.p1{rotate:180deg}
.lanes{position:absolute;inset:0;width:100%;height:100%;display:block}
/* zona = a visão sem a faixa dos cascos; o quadro dentro dela gira junto com a imagem (orientação de cada lado na dupla) */
.zone{position:absolute;left:0;right:0;top:0;bottom:var(--padH);container-type:size;pointer-events:none}
.frame{position:absolute;left:50%;top:50%;width:100cqw;height:100cqh;translate:-50% -50%;--cx:.5;--sx:.5;--sy:.66;--nw:92%}
.frame.q1{rotate:90deg;width:100cqh;height:100cqw}
.frame.q3{rotate:-90deg;width:100cqh;height:100cqw}
.frame.q1 .card,.frame.q3 .card{left:calc(var(--cx) * 100%);right:auto;width:var(--nw);translate:-50% 0;padding:0}
.frame.q1 .card.title .c2,.frame.q3 .card.title .c2{font-size:30px}
.frame.q1 .sync,.frame.q3 .sync{white-space:normal;width:var(--nw);text-align:center;font-size:18px;line-height:1.05}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
#divider{position:absolute;left:0;right:0;top:50%;height:4px;translate:0 -50%;background:linear-gradient(90deg,var(--pink),var(--gold),var(--mint),var(--blue));box-shadow:0 0 12px rgba(255,214,96,.55);pointer-events:none}

/* HUD */
.hud::before{content:'';position:absolute;inset:0 0 -40px;background:linear-gradient(180deg,rgba(11,7,32,.78),rgba(11,7,32,0));z-index:-1}
.hud{position:absolute;top:0;left:0;right:0;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none}
.two .hud{padding:9px 12px 0}
.score{display:flex;flex-direction:column;gap:3px;font-family:var(--f-pixel);text-shadow:0 2px 0 var(--outline)}
.score .lbl{font-size:9px;letter-spacing:.14em;color:var(--muted)}
.score b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.two .score b{font-size:16px}
/* na dupla o placar fica numa linha só, para não invadir as pistas quando a imagem está girada */
.two .score{flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.two .score .lbl{display:none}
.two .tag{margin-top:0}
.two .camBtn{display:none}
.mult{font-size:12px;color:var(--gold)}
.who{display:none;align-self:flex-start;font-family:var(--f-pixel);font-size:10px;padding:3px 6px;border-radius:4px;text-shadow:none}
.two .who{display:inline-block}
.who.j1{background:var(--pink);color:#fff}
.who.j2{background:var(--teal);color:var(--outline)}
.blk{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:2px}
.blk span{font-family:var(--f-display);font-size:13px;letter-spacing:.02em;filter:drop-shadow(0 2px 0 var(--outline));white-space:nowrap}
.two .blk span{font-size:11px}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .15s,scale .15s}
.pip.star{width:14px;height:14px;border-radius:0;clip-path:polygon(50% 0,63% 35%,100% 38%,71% 61%,80% 100%,50% 78%,20% 100%,29% 61%,0 38%,37% 35%)}
.pip.crown{width:24px;height:14px;border-radius:2px;clip-path:polygon(0 100%,0 18%,26% 55%,50% 0,74% 55%,100% 18%,100% 100%)}
.pip.c{background:rgba(255,255,255,.7);scale:1.3}
.pip.o{background:var(--gold)}
.pip.x{background:rgba(255,79,168,.38)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pill{pointer-events:auto;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;color:var(--ink);background:rgba(20,10,50,.62);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.pill:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tag{align-self:flex-start;margin-top:4px;font-family:var(--f-pixel);font-size:10px;padding:4px 7px;border-radius:4px;background:var(--gold);color:var(--outline)}
.icon{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(20,10,50,.62);display:grid;place-items:center;cursor:pointer;padding:0}
.two .icon{width:34px;height:34px}
.icon i{display:block;width:13px;height:14px;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
.icon:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Cascos */
.pads{position:absolute;left:0;right:0;bottom:0;height:var(--padH);display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.two .pads{padding-bottom:12px}
.pad{position:relative;border-radius:46% 46% 32% 32% / 42% 42% 30% 30%;display:grid;place-items:center;transition:translate .05s,filter .05s}
.pad.pl{--sh:var(--pink-dk);background:radial-gradient(120% 95% at 50% 22%,#ffb1db 0%,var(--pink) 52%,#d42f7c 100%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 6px 0 var(--sh),0 12px 22px rgba(0,0,0,.4)}
.pad.pr{--sh:var(--blue-dk);background:radial-gradient(120% 95% at 50% 22%,#b3c9ff 0%,var(--blue) 52%,#2f55d4 100%);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 6px 0 var(--sh),0 12px 22px rgba(0,0,0,.4)}
.pad svg{width:42%;max-width:86px;height:auto;max-height:70%}
.pad.on{translate:0 5px;filter:brightness(1.22);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 1px 0 var(--sh),0 4px 10px rgba(0,0,0,.4)}

/* Nomes das manobras */
.names{position:absolute;left:0;right:0;top:14%;height:0;pointer-events:none;translate:calc((var(--cx) - .5) * 100%) 0}
.nmw{position:absolute;top:0;left:50%;translate:-50% 0;width:var(--nw);display:flex;justify-content:center;transition:opacity .3s,translate .3s}
.nmw.old{opacity:0;translate:-50% -26px}
.nm{position:relative;text-align:center;font-family:var(--f-display);line-height:1.04;text-wrap:balance}
.nm .w{display:inline-block;white-space:nowrap}
.nm.t1{font-size:clamp(20px,6.6cqw,28px);color:#fff;filter:drop-shadow(2px 0 0 var(--pink-dk)) drop-shadow(-2px 0 0 var(--pink-dk)) drop-shadow(0 2px 0 var(--pink-dk)) drop-shadow(0 -2px 0 var(--pink-dk)) drop-shadow(0 4px 0 rgba(0,0,0,.3));animation:pop1 .32s cubic-bezier(.3,1.7,.5,1) both}
.nm.t2{font-size:clamp(21px,7.4cqw,32px);filter:drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline)) drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 -2px 0 var(--outline)) drop-shadow(0 0 9px rgba(178,123,255,.9))}
.nm.t2 .w{background:linear-gradient(180deg,#fff 0%,#ffe1f3 30%,#ff6ab8 62%,#b27bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:wbounce .42s cubic-bezier(.3,1.8,.5,1) both}
.nm.t3{font-size:clamp(23px,8.2cqw,36px);filter:drop-shadow(2.5px 0 0 var(--outline)) drop-shadow(-2.5px 0 0 var(--outline)) drop-shadow(0 2.5px 0 var(--outline)) drop-shadow(0 -2.5px 0 var(--outline)) drop-shadow(0 0 14px rgba(255,214,96,.95))}
.nm.t3 .c{display:inline-block;animation:drop .44s cubic-bezier(.25,1.6,.45,1) both,rainbow 1.1s linear infinite}
.burst{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,96,.26) 0deg 7deg,rgba(255,106,184,0) 7deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 22%,transparent 100%);mask:radial-gradient(closest-side,#000 22%,transparent 100%);animation:burstIn .5s ease-out both,spin 7s linear infinite;pointer-events:none}
@keyframes pop1{0%{scale:0;opacity:0}60%{scale:1.22;opacity:1}100%{scale:1}}
@keyframes wbounce{0%{translate:0 18px;scale:.4;opacity:0}60%{translate:0 -6px;scale:1.15;opacity:1}100%{translate:0 0;scale:1}}
@keyframes drop{0%{translate:0 -60px;scale:2;rotate:-25deg;opacity:0}55%{opacity:1}100%{translate:0 0;scale:1;rotate:0deg}}
@keyframes rainbow{0%,100%{color:#ff6ab8}20%{color:#ffd66b}40%{color:#8dffb5}60%{color:#7fd7ff}80%{color:#b88cff}}
@keyframes burstIn{0%{scale:0;opacity:0}100%{scale:1;opacity:1}}
@keyframes spin{to{rotate:360deg}}
/* na dupla a metade é baixa: nomes menores, crescendo para cima a partir do chifre */
.two .nmw{top:auto;bottom:0}
.two .nm.t1{font-size:clamp(17px,5.4cqw,22px)}
.two .nm.t2{font-size:clamp(18px,5.8cqw,24px)}
.two .nm.t3{font-size:clamp(19px,6.2cqw,26px)}

/* Sincronia (dupla) */
.sync{position:absolute;left:calc(var(--sx) * 100%);top:calc(var(--sy) * 100%);translate:-50% 0;font-family:var(--f-display);font-size:clamp(18px,6cqw,24px);color:var(--mint);white-space:nowrap;opacity:0;pointer-events:none;filter:drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline)) drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 -2px 0 var(--outline)) drop-shadow(0 0 10px rgba(125,255,200,.9))}
.sync.show{animation:syncIn 1.5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes syncIn{0%{opacity:0;scale:.5}15%{opacity:1;scale:1.15}30%{scale:1}80%{opacity:1}100%{opacity:0;translate:-50% -14px}}

/* Cartões de bloco e contagem */
#diag{position:absolute;left:8px;bottom:calc(16.5% + 6px);margin:0;font-family:var(--f-pixel);font-size:9px;letter-spacing:.04em;color:var(--gold);background:rgba(11,7,32,.75);padding:3px 6px;border-radius:4px;pointer-events:none;max-width:70%;z-index:5}
.card{position:absolute;left:0;right:0;translate:calc((var(--cx) - .5) * 100%) 0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;opacity:0;padding:0 16px}
.card.title{top:15.5%}
.card.count{top:45%}
.two .card.title{top:21%}
.two .card.count{top:28%}
.card.show{animation:cardIn .4s cubic-bezier(.2,1.5,.4,1) both,cardOut .35s ease-in var(--hold,1s) forwards}
.card .c1{font-family:var(--f-pixel);font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;text-shadow:0 2px 0 var(--outline)}
.card .c2{font-family:var(--f-display);font-size:clamp(34px,11cqw,50px);color:#fff;filter:drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline)) drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 -2px 0 var(--outline)) drop-shadow(0 5px 0 rgba(0,0,0,.3))}
.card.count .c2{font-size:clamp(60px,21cqw,92px);color:var(--gold)}
.two .card.count .c2{font-size:clamp(52px,17cqw,78px)}
@keyframes cardIn{0%{opacity:0;scale:.6}100%{opacity:1;scale:1}}
@keyframes cardOut{to{opacity:0;scale:1.08}}

/* Telas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-block:max(28px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-bottom));padding-inline:20px;gap:14px;text-align:center;z-index:3}
.panelS{justify-content:safe center;background:var(--panel);overflow-y:auto;touch-action:pan-y}
#title{justify-content:space-between;background:linear-gradient(180deg,rgba(11,7,32,.6) 0%,rgba(11,7,32,0) 30%,rgba(11,7,32,0) 52%,rgba(11,7,32,.9) 78%)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.9;margin-top:9%}
.logo .l1{font-family:var(--f-display);font-size:clamp(46px,15.5cqw,68px);color:#fff;filter:drop-shadow(3px 0 0 var(--pink-dk)) drop-shadow(-3px 0 0 var(--pink-dk)) drop-shadow(0 3px 0 var(--pink-dk)) drop-shadow(0 -3px 0 var(--pink-dk)) drop-shadow(0 6px 0 var(--outline))}
.logo .l2{font-family:var(--f-display);font-size:clamp(28px,9.6cqw,42px);color:var(--ice);filter:drop-shadow(3px 0 0 var(--blue-dk)) drop-shadow(-3px 0 0 var(--blue-dk)) drop-shadow(0 3px 0 var(--blue-dk)) drop-shadow(0 -3px 0 var(--blue-dk)) drop-shadow(0 6px 0 var(--outline))}
.sub{font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:12px 0 0;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:12px;width:min(100%,300px)}
.menu.row{flex-direction:row;flex-wrap:wrap}
#bReplay{flex:1 1 100%}
.menu.row .btn{flex:1;font-size:17px;white-space:nowrap;padding-inline:12px}
.btn{font-family:var(--f-display);font-size:19px;color:#fff;border:0;border-radius:999px;padding:13px 18px;background:var(--pink);box-shadow:0 5px 0 var(--pink-dk),0 10px 20px rgba(0,0,0,.35);cursor:pointer}
.btn:active{translate:0 3px;box-shadow:0 2px 0 var(--pink-dk)}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 var(--blue-dk),0 10px 20px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);font-size:16px}
.btn.sm{font-size:14px;padding:9px 14px}
.btn.danger{background:#e2335f;box-shadow:0 5px 0 #8f1636}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hint{font-size:13px;line-height:1.5;color:var(--muted);max-width:34ch;margin:0}
.hint b{color:var(--ink);font-weight:800}
.eyebrow{font-family:var(--f-pixel);font-size:10px;letter-spacing:.16em;color:var(--gold);margin:0;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;filter:drop-shadow(0 3px 0 var(--outline))}
.flags{display:flex;gap:8px}
#title .flags{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px}
#title .ver{position:absolute;left:14px;bottom:max(10px,env(safe-area-inset-bottom));font-family:var(--f-pixel);font-size:9px;letter-spacing:.12em;color:var(--muted);opacity:.55;text-transform:uppercase}
#aboutS .hint{max-width:40ch}
#aboutS .ver2{font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:-6px 0 0;text-transform:uppercase}
#aboutS a{color:var(--mint);text-decoration:underline;text-underline-offset:3px}
.flag{width:46px;height:34px;padding:4px;border-radius:9px;border:2px solid transparent;background:rgba(20,10,50,.55);cursor:pointer;display:grid}
.flag[aria-pressed=true]{border-color:var(--gold);background:rgba(255,214,96,.18)}
.flag svg{width:100%;height:100%;display:block;border-radius:3px}
.flag:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Telas divididas da dupla */
.split{padding:0;display:grid;grid-template-rows:1fr 1fr;gap:0;align-items:stretch;justify-items:stretch}
.half{position:relative;container-type:size;min-height:0;overflow:hidden}
.half.flip{rotate:180deg}
.hin{position:absolute;left:50%;top:50%;width:100cqw;height:100cqh;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 20px;text-align:center}
.hin.q1{rotate:90deg;width:100cqh;height:100cqw}
.hin.q3{rotate:-90deg;width:100cqh;height:100cqw}
#ready2 .hin{justify-content:flex-end;padding-bottom:22px;background:linear-gradient(180deg,rgba(14,8,40,0) 22%,rgba(14,8,40,.9) 66%)}
.orient{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rotb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.rotb:disabled{opacity:.3;cursor:default}
.rotb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.olbl{min-width:12ch;text-align:center}
#ready2 .who2{font-family:var(--f-display);font-size:30px;margin:0;filter:drop-shadow(0 3px 0 var(--outline))}
#ready2 .j1{color:#ffb1db}
#ready2 .j2{color:var(--teal)}
#ready2 .btn.on{background:var(--mint);color:var(--outline);box-shadow:0 5px 0 #2e9c74}
#results2 .half{background:var(--panel)}
#results2 .hin{gap:8px;justify-content:safe center}
#results2 .half.flip{background:rgba(10,30,44,.9)}
.badge{font-family:var(--f-display);font-size:34px;margin:0;color:var(--gold);filter:drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline)) drop-shadow(0 3px 0 var(--outline))}
.badge.lose{color:var(--ice)}

/* Pose final a dois numa imagem só (os dois do mesmo lado da tela) */
#pano{position:absolute;inset:0;container-type:size;pointer-events:none;z-index:2}
#pano .tbox{--cx:.5;--nw:86%;--sx:.5;--sy:.78}
#pano.rp .tbox{--sy:.6}
#pano.rp .tbox.q3,#pano.rp .tbox.q1{--sy:.52}
#pano .names{top:11%}
#pano .nmw{top:0;bottom:auto}
#pano .card.title{top:22%}
.nmw.duo{flex-direction:column;align-items:center;gap:3px}
.duoTag{font-family:var(--f-pixel);font-size:10px;letter-spacing:.16em;color:var(--mint);text-transform:uppercase;white-space:nowrap;filter:drop-shadow(0 2px 0 var(--outline))}

/* Escolha de personagem: a roda em 3D ao fundo e o painel embaixo */
#select{justify-content:flex-end;padding-inline:16px;gap:0;background:linear-gradient(180deg,rgba(11,7,32,0) 46%,rgba(11,7,32,.94) 68%)}
#ltags{position:absolute;inset:0;pointer-events:none}
.ntag{position:absolute;translate:-50% -100%;display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;transition:opacity .3s}
.ntag b{font-family:var(--f-display);font-weight:400;font-size:15px;filter:drop-shadow(0 2px 0 var(--outline))}
.ntag span{font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--muted)}
.selp{position:relative;width:min(100%,360px);display:flex;flex-direction:column;gap:10px;text-align:left}
.selp header{display:flex;flex-direction:column;gap:2px}
.selp h2{font-size:26px;line-height:1.05}
.selp .menu.row{width:100%}
.selp .hint{max-width:none;font-size:12px;line-height:1.45}
.pick{display:flex;flex-direction:column;gap:6px}
.pkh{display:flex;align-items:center;gap:7px;min-height:24px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.pick.focus .plbl{color:var(--gold)}
/* na dupla: celular desenhado com a metade da tela de cada jogador, e o botão de inverter os lados */
.mini,.side,.swapb{display:none}
#select.duo .mini{display:block;position:relative;width:12px;height:19px;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);flex:none}
.mini::after{content:'';position:absolute;left:2.5px;right:2.5px;height:6px;border-radius:1px;background:var(--c)}
.mini.bot::after{bottom:2.5px}
.mini.top::after{top:2.5px}
#pick0 .mini{--c:var(--pink)}
#pick1 .mini{--c:var(--teal)}
#select.duo .side{display:inline;color:var(--ink)}
#select.duo .swapb{display:inline-block;margin-left:auto;font:400 10px var(--f-pixel);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.08);border:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);border-radius:999px;padding:6px 10px;cursor:pointer}
.swapb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.swapb .arr{font:700 13px/1 system-ui,sans-serif;vertical-align:-1px}
.ntag .own{font-style:normal;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;padding:2px 5px;border-radius:4px;margin-bottom:2px}
.ntag .own.j1{background:var(--pink);color:#fff}
.ntag .own.j2{background:var(--teal);color:var(--outline)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);color:var(--ink);font:800 14px var(--f-body);cursor:pointer}
.chip i{width:26px;height:8px;border-radius:4px;display:block}
.chip[aria-pressed=true]{border-color:var(--gold);background:rgba(255,214,96,.14)}
.chip:disabled{opacity:.3;cursor:default}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Transformação: só 2× e Pular, embaixo da imagem de cada um (giram junto com ela na dupla) */
.tfx{position:absolute;inset:0;container-type:size;pointer-events:none}
.tbox{position:absolute;left:50%;top:50%;width:100cqw;height:100cqh;translate:-50% -50%}
.tbox.q1{rotate:90deg;width:100cqh;height:100cqw}
.tbox.q3{rotate:-90deg;width:100cqh;height:100cqw}
.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px max(14px,env(safe-area-inset-bottom))}
.two .ctrl{padding:0 12px 12px}
.cbtn{pointer-events:auto;font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;color:var(--ink);background:rgba(20,10,50,.62);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:10px 16px;min-width:64px;cursor:pointer;text-transform:uppercase}
.cbtn[aria-pressed=true]{background:var(--gold);color:var(--outline);border-color:var(--gold)}
.cbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wait{position:absolute;left:50%;top:22%;translate:-50% 0;margin:0;font-family:var(--f-display);font-size:20px;color:#fff;white-space:nowrap;filter:drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 0 8px rgba(0,0,0,.5))}

/* Opções */
.opts{display:flex;flex-direction:column;gap:8px;width:min(100%,330px)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.06);color:var(--ink);font:800 15px var(--f-body);border:0;text-align:left;cursor:pointer;min-height:52px}
div.opt{cursor:default}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt em{font-style:normal;font-family:var(--f-pixel);font-size:11px;color:var(--gold)}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:translate .15s}
.sw[aria-pressed=true] .tg{background:var(--mint)}
.sw[aria-pressed=true] .tg::after{translate:18px 0}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:999px;padding:3px}
.seg button{font:400 11px var(--f-pixel);letter-spacing:.06em;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--violet);color:#fff}
.confirm{display:flex;flex-direction:column;gap:12px;align-items:center;padding:14px;border-radius:14px;background:rgba(255,79,168,.12);box-shadow:inset 0 0 0 2px rgba(255,79,168,.4);width:min(100%,330px)}
.confirm p{margin:0;font-size:14px;line-height:1.45}
.confirm .menu.row{justify-content:space-between}
.confirm .menu.row .btn{flex:0 1 auto}
.note{font-size:13px;color:var(--mint);margin:0;min-height:1.2em}

/* Calibração */
.pulse{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffb1db,var(--pink) 60%,var(--pink-dk));box-shadow:0 0 0 0 rgba(255,214,96,.0);font-family:var(--f-pixel);font-size:28px;transition:scale .08s,box-shadow .08s;flex:none}
.pulse.beat{scale:1.12;box-shadow:0 0 0 10px rgba(255,214,96,.45)}
.pulse.tap{filter:brightness(1.3)}
.res{font-size:15px;line-height:1.5;min-height:3em;margin:0;max-width:32ch}
.res b{font-family:var(--f-pixel);font-weight:400;color:var(--gold)}
.nudge{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:13px}

/* Escolha da fase */
.phases{display:grid;gap:12px;width:min(100%,330px)}
.phc{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;padding:8px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.phc .art{width:132px;height:auto;border-radius:10px;display:block}
.phc:active{translate:0 2px}
.phc:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.phc[aria-pressed=true]{border-color:var(--gold);background:rgba(255,214,96,.1)}
.phc.neon{border-color:rgba(255,61,184,.55);box-shadow:0 0 14px rgba(255,61,184,.25)}
.phc.neon[aria-pressed=true]{border-color:var(--gold)}
.pht{display:flex;flex-direction:column;gap:3px}
.pht small{font-family:var(--f-pixel);font-size:9px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.pht b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.pht em{font-style:normal;font-size:12px;line-height:1.35;color:var(--muted)}
.pht .phb{font-style:normal;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--mint)}
.phc.neon .pht b{color:#ffd0f0;text-shadow:0 0 8px rgba(255,61,184,.8)}

/* Replay */
#rpUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
#rpUI button{pointer-events:auto}
#rpUI.q3,#rpUI.q1{inset:auto;left:50%;top:50%;width:100cqh;height:100cqw;translate:-50% -50%;rotate:-90deg}
#rpUI.q1{rotate:90deg}
#pano .rpPads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rpTop,.rpBot{display:flex;align-items:center;gap:10px}
.rpTag{font-family:var(--f-pixel);font-size:10px;letter-spacing:.12em;color:#fff;background:#e2335f;border-radius:4px;padding:3px 6px}
#rpLbl{flex:1;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 var(--outline)}
.rpTrack,.expTrack{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.rpTrack i,.expTrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold))}
.rpTrack{position:relative;overflow:visible;pointer-events:auto;touch-action:none;cursor:pointer}
.rpTrack::before{content:'';position:absolute;inset:-16px 0}
.rpTrack i{border-radius:3px}
#rpKnob{position:absolute;top:50%;left:0;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.4);translate:-50% -50%;scale:0;opacity:0;transition:scale .15s,opacity .15s;pointer-events:none}
#rpKnob.on{scale:1;opacity:1}
.expTrack{flex:none;width:min(100%,300px)}
.rpSegs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,330px)}
.rpSeg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--ink);font:800 13px var(--f-body);text-align:left;cursor:pointer}
.rpSeg:first-child{grid-column:1/-1}
.rpSeg small{font-family:var(--f-pixel);font-size:9px;font-weight:400;color:var(--muted)}
.rpSeg[aria-pressed=true]{border-color:var(--gold);background:rgba(255,214,96,.12)}
.rpSeg:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rpOr{width:min(100%,330px)}
#expCanvas{max-width:min(100%,240px);max-height:42cqh;width:auto;height:auto;border-radius:10px;image-rendering:pixelated;background:#000}
#expCanvas.land{max-width:min(100%,330px)}

/* Resultado */
#pauseS.r1,#pauseS.r3{inset:auto;left:50%;top:50%;width:100cqh;height:100cqw;translate:-50% -50%}
#pauseS.r1{rotate:90deg}
#pauseS.r2{rotate:180deg}
#pauseS.r3{rotate:-90deg}
.judges{display:flex;gap:10px}
.jc{width:70px;padding:10px 0 8px;background:#f7f3ea;color:#1b1030;border-radius:6px;box-shadow:0 5px 0 #b9ad95,0 10px 18px rgba(0,0,0,.4);font-family:var(--f-pixel);display:flex;flex-direction:column;align-items:center;gap:4px;rotate:-3deg}
.jc:nth-child(2){rotate:2deg;translate:0 -4px}
.jc:nth-child(3){rotate:-1deg}
.jc b{font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.jc small{font-size:8px;letter-spacing:.1em;color:#6b5a8a}
.judges.sm .jc{width:56px;padding:7px 0 6px}
.judges.sm .jc b{font-size:21px}
.total{display:flex;flex-direction:column;gap:2px}
.total b{font-family:var(--f-display);font-weight:400;font-size:36px;font-variant-numeric:tabular-nums}
.total span{font-size:13px;color:var(--muted)}
.best{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--gold);margin:0;min-height:1em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;width:min(100%,320px)}
.stats.five{grid-template-columns:repeat(5,1fr);gap:5px;width:min(100%,340px)}
.stats div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px 4px}
.stats dt{font-size:9px;color:var(--muted);font-family:var(--f-pixel);letter-spacing:.04em}
.stats dd{margin:2px 0 0;font-family:var(--f-pixel);font-size:17px;font-variant-numeric:tabular-nums}
#results2 .total b{font-size:30px}
.album{width:min(100%,330px);display:flex;flex-direction:column;gap:8px}
.album ol{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left}
.album li{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline;font-size:13px}
.album li em{font-style:normal;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--muted)}
.album li span{color:var(--ink);font-weight:800;line-height:1.3}
.album li span.lock{color:rgba(255,255,255,.3);font-weight:500}
.album li.phsep{display:block;margin-top:14px;font-family:var(--f-display);font-size:18px;color:var(--gold);text-align:center}
.album li.phsep:first-child{margin-top:0}
.album li.sep{display:block;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;color:var(--mint);text-transform:uppercase}
.album li small{display:block;font-family:var(--f-pixel);font-size:9px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.album.big li{font-size:15px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
@media (prefers-reduced-motion:reduce){.burst{animation:none}.nm.t3 .c{animation:drop .3s both}}
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="divider" hidden></div>
  <div id="pano" hidden><div class="flash"></div><div class="tbox"><canvas class="rpPads" hidden></canvas><div class="names" aria-live="polite"></div><div class="card"></div><div class="sync"></div></div></div>
  <div id="rpUI" hidden>
    <div class="rpTop"><span class="rpTag">REPLAY</span><span id="rpLbl"></span><button class="icon" id="rpClose" data-i18n-aria="close">✕</button></div>
    <div class="rpBot"><button class="icon" id="rpPlay" aria-label="">❚❚</button><div class="rpTrack"><i id="rpProg"></i><b id="rpKnob"></b></div></div>
  </div>
  <p id="diag" hidden></p>

  <section id="title" class="screen">
    <div class="flags" role="group" aria-label="Idioma / Idioma"><button class="flag" data-lang="pt"></button><button class="flag" data-lang="es"></button></div>
    <div>
      <div class="logo"><span class="l1" data-i18n="logo1">Galope</span><span class="l2" data-i18n="logo2">no Gelo</span></div>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="menu">
      <button class="btn" id="b1p" data-i18n="p1"></button>
      <button class="btn alt" id="b2p" data-i18n="p2"></button>
      <button class="btn ghost" id="bDemo" data-i18n="demo"></button>
      <div class="menu row"><button class="btn ghost sm" id="bOpt" data-i18n="options"></button><button class="btn ghost sm" id="bAlbum" data-i18n="album"></button><button class="btn ghost sm rpBtn" id="bReplay" data-i18n="replay" hidden></button></div>
      <p class="hint" data-i18n-html="hint"></p>
    </div>
    <span class="ver" id="verTag"></span>
  </section>

  <section id="phaseS" class="screen panelS" hidden>
    <header><p class="eyebrow" id="phMode"></p><h2 data-i18n="phTitle"></h2></header>
    <div class="phases">
      <button class="phc" data-ph="0">
        <svg class="art" viewBox="0 0 160 84" aria-hidden="true"><defs><linearGradient id="phs1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0730"/><stop offset=".7" stop-color="#2b1f63"/><stop offset="1" stop-color="#7a2f7c"/></linearGradient></defs><rect width="160" height="84" fill="url(#phs1)"/><circle cx="128" cy="18" r="8" fill="#fff4c8"/><g fill="#fff"><rect x="20" y="12" width="1.5" height="1.5"/><rect x="58" y="8" width="1.5" height="1.5"/><rect x="92" y="20" width="1.5" height="1.5"/><rect x="146" y="40" width="1.5" height="1.5"/></g><path d="M40 62 43 14 46 62Z" fill="#f1edf6"/><path d="M43 9 45 14 41 14Z" fill="#f1edf6"/><path d="M8 52q72-18 144 0" stroke="#ffd660" stroke-width="1" stroke-dasharray="2 3" fill="none"/><ellipse cx="80" cy="74" rx="76" ry="12" fill="#bfe8ff" opacity=".85"/><ellipse cx="80" cy="74" rx="76" ry="12" fill="none" stroke="#ff4fa8" stroke-width="2"/></svg>
        <span class="pht"><small><span data-i18n="phase"></span> 1</small><b data-i18n="ph1"></b><em data-i18n="ph1s"></em><i class="phb"></i></span>
      </button>
      <button class="phc neon" data-ph="1">
        <svg class="art" viewBox="0 0 160 84" aria-hidden="true"><rect width="160" height="84" fill="#140a2a"/><g stroke-width="1.2" opacity=".8"><path d="M80 22 6 60M80 22 40 84M80 22 120 84M80 22 154 60M80 22 0 30M80 22 160 26" stroke="#fff6ff"/></g><path d="M80 0v12" stroke="#9a90b8"/><circle cx="80" cy="22" r="10" fill="#c9d3ec"/><path d="M70 22h20M72 17h16M72 27h16M80 12v20M75 13v18M85 13v18" stroke="#6b7090" stroke-width=".8"/><g><rect x="0" y="66" width="20" height="9" fill="#ff3db8"/><rect x="20" y="66" width="20" height="9" fill="#3df2ff"/><rect x="40" y="66" width="20" height="9" fill="#ffe14d"/><rect x="60" y="66" width="20" height="9" fill="#b04dff"/><rect x="80" y="66" width="20" height="9" fill="#4dff9a"/><rect x="100" y="66" width="20" height="9" fill="#ff3db8"/><rect x="120" y="66" width="20" height="9" fill="#3df2ff"/><rect x="140" y="66" width="20" height="9" fill="#ffe14d"/><rect x="0" y="75" width="20" height="9" fill="#b04dff"/><rect x="20" y="75" width="20" height="9" fill="#ffe14d"/><rect x="40" y="75" width="20" height="9" fill="#ff3db8"/><rect x="60" y="75" width="20" height="9" fill="#3df2ff"/><rect x="80" y="75" width="20" height="9" fill="#ffe14d"/><rect x="100" y="75" width="20" height="9" fill="#4dff9a"/><rect x="120" y="75" width="20" height="9" fill="#ff3db8"/><rect x="140" y="75" width="20" height="9" fill="#b04dff"/></g><text x="22" y="50" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="none" stroke="#ff3db8" stroke-width="1.4">DISCO</text></svg>
        <span class="pht"><small><span data-i18n="phase"></span> 2</small><b data-i18n="ph2"></b><em data-i18n="ph2s"></em><i class="phb"></i></span>
      </button>
    </div>
    <button class="btn ghost" id="phBack" data-i18n="back"></button>
  </section>

  <section id="select" class="screen" hidden>
    <div id="ltags"></div>
    <div class="selp">
      <header><p class="eyebrow" id="selMode"></p><h2 data-i18n="selTitle"></h2></header>
      <div class="pick" id="pick0">
        <div class="pkh"><i class="mini" aria-hidden="true"></i><span class="plbl"><span data-i18n="pl"></span> 1</span><span class="side"></span><button class="swapb" id="swapS" data-i18n-aria="swapL"><b class="arr" aria-hidden="true">⇅</b> <span data-i18n="swap"></span></button></div>
        <div class="chips"></div>
      </div>
      <div class="pick" id="pick1" hidden>
        <div class="pkh"><i class="mini" aria-hidden="true"></i><span class="plbl"><span data-i18n="pl"></span> 2</span><span class="side"></span></div>
        <div class="chips"></div>
      </div>
      <div class="menu row"><button class="btn ghost" id="sBack" data-i18n="back"></button><button class="btn" id="goT" data-i18n="transform"></button></div>
      <p class="hint" id="selHint"></p>
    </div>
  </section>

  <section id="ready2" class="screen split" hidden>
    <div class="half flip"><div class="hin" data-p="1">
      <p class="who2 j2"><span data-i18n="pl"></span> <span class="pn">2</span></p>
      <p class="hint" data-i18n="readyHint"></p>
      <div class="orient"><button class="rotb" data-p="1" data-d="-1" data-i18n-aria="rotL">↺</button><span class="olbl" data-p="1"></span><button class="rotb" data-p="1" data-d="1" data-i18n-aria="rotR">↻</button></div>
      <button class="btn alt rdy" data-p="1" data-i18n="ready"></button>
    </div></div>
    <div class="half"><div class="hin" data-p="0">
      <p class="who2 j1"><span data-i18n="pl"></span> <span class="pn">1</span></p>
      <p class="hint" data-i18n="readyHint"></p>
      <div class="orient"><button class="rotb" data-p="0" data-d="-1" data-i18n-aria="rotL">↺</button><span class="olbl" data-p="0"></span><button class="rotb" data-p="0" data-d="1" data-i18n-aria="rotR">↻</button></div>
      <button class="btn rdy" data-p="0" data-i18n="ready"></button>
      <button class="btn ghost sm" id="rBack" data-i18n="back"></button>
    </div></div>
  </section>

  <section id="options" class="screen panelS" hidden>
